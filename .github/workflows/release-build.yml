name: release-build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v1.0.0)
        required: true
      name:
        description: Release name (optional)
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Crypto++ lib
        shell: pwsh
        run: |
          if ("${{ matrix.arch }}" -eq "x86") {
            $libPath = "ExtLib/cryptlib32.lib"
          } else {
            $libPath = "ExtLib/cryptlib64.lib"
          }

          if (Test-Path $libPath) {
            "CRYPTLIB_PRESENT=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            "CRYPTLIB_PRESENT=false" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "$libPath missing, skip build."
          }

      - name: Setup MSVC
        if: env.CRYPTLIB_PRESENT == 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Configure
        if: env.CRYPTLIB_PRESENT == 'true'
        run: cmake --preset ${{ matrix.arch }}-ninja

      - name: Build all targets
        if: env.CRYPTLIB_PRESENT == 'true'
        run: cmake --build --preset ${{ matrix.arch }}-ninja-release --target cryptodll parseflashfile securityalgo seednkey_sls

      - name: Upload build artifacts
        if: env.CRYPTLIB_PRESENT == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.arch }}-release-assets
          path: |
            build/${{ matrix.arch }}-ninja/bin/*.dll
            build/${{ matrix.arch }}-ninja/bin/*.map

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: "*-release-assets"
          merge-multiple: true

      - name: Create or update release and upload assets
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.tag }}
          name: ${{ inputs.name != '' && inputs.name || inputs.tag }}
          allowUpdates: true
          replacesArtifacts: true
          generateReleaseNotes: true
          artifacts: "dist/*.dll,dist/*.map"
