name: build

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Build architecture
        required: true
        default: all
        type: choice
        options:
          - all
          - x86
          - x64
      target:
        description: Build target
        required: true
        default: all
        type: choice
        options:
          - all
          - cryptodll
          - parseflashfile
          - securityalgo
          - seednkey_sls

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
        target: [cryptodll, parseflashfile, securityalgo, seednkey_sls]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Crypto++ libs
        shell: pwsh
        run: |
          $has32 = Test-Path "ExtLib/cryptlib32.lib"
          $has64 = Test-Path "ExtLib/cryptlib64.lib"
          if ($has32 -and $has64) {
            "CRYPTLIB_PRESENT=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            "CRYPTLIB_PRESENT=false" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Crypto++ libs missing, skip build."
          }

      - name: Configure (x86)
        if: matrix.arch == 'x86' && env.CRYPTLIB_PRESENT == 'true' && (github.event.inputs.arch == 'all' || github.event.inputs.arch == 'x86') && (github.event.inputs.target == 'all' || github.event.inputs.target == matrix.target)
        run: cmake --preset x86

      - name: Configure (x64)
        if: matrix.arch == 'x64' && env.CRYPTLIB_PRESENT == 'true' && (github.event.inputs.arch == 'all' || github.event.inputs.arch == 'x64') && (github.event.inputs.target == 'all' || github.event.inputs.target == matrix.target)
        run: cmake --preset x64

      - name: Build (x86)
        if: matrix.arch == 'x86' && env.CRYPTLIB_PRESENT == 'true' && (github.event.inputs.arch == 'all' || github.event.inputs.arch == 'x86') && (github.event.inputs.target == 'all' || github.event.inputs.target == matrix.target)
        run: cmake --build --preset x86-release --target ${{ matrix.target }}

      - name: Build (x64)
        if: matrix.arch == 'x64' && env.CRYPTLIB_PRESENT == 'true' && (github.event.inputs.arch == 'all' || github.event.inputs.arch == 'x64') && (github.event.inputs.target == 'all' || github.event.inputs.target == matrix.target)
        run: cmake --build --preset x64-release --target ${{ matrix.target }}

      - name: Upload artifacts
        if: env.CRYPTLIB_PRESENT == 'true' && (github.event.inputs.arch == 'all' || github.event.inputs.arch == matrix.arch) && (github.event.inputs.target == 'all' || github.event.inputs.target == matrix.target)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-${{ matrix.target }}
          path: |
            build/${{ matrix.arch }}/bin/Release/*.dll
            build/${{ matrix.arch }}/bin/Release/*.map
