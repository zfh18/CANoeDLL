name: build

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Build architecture
        required: true
        default: all
        type: choice
        options:
          - all
          - x86
          - x64
      target:
        description: Build target
        required: true
        default: all
        type: choice
        options:
          - all
          - cryptodll
          - parseflashfile
          - securityalgo
          - seednkey_sls

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-x86:
    if: ${{ inputs.arch == 'all' || inputs.arch == 'x86' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [cryptodll, parseflashfile, securityalgo, seednkey_sls]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Crypto++ x86 lib
        shell: pwsh
        run: |
          if (Test-Path "ExtLib/cryptlib32.lib") {
            "CRYPTLIB_PRESENT=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            "CRYPTLIB_PRESENT=false" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "ExtLib/cryptlib32.lib missing, skip x86 build."
          }

      - name: Setup MSVC (x86)
        if: env.CRYPTLIB_PRESENT == 'true' && (inputs.target == 'all' || inputs.target == matrix.target)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Configure (x86)
        if: env.CRYPTLIB_PRESENT == 'true' && (inputs.target == 'all' || inputs.target == matrix.target)
        run: cmake --preset x86-ninja

      - name: Build (x86)
        if: env.CRYPTLIB_PRESENT == 'true' && (inputs.target == 'all' || inputs.target == matrix.target)
        run: cmake --build --preset x86-ninja-release --target ${{ matrix.target }}

      - name: Upload artifacts (x86)
        if: env.CRYPTLIB_PRESENT == 'true' && (inputs.target == 'all' || inputs.target == matrix.target)
        uses: actions/upload-artifact@v6
        with:
          name: x86-${{ matrix.target }}
          path: |
            build/x86-ninja/bin/*.dll
            build/x86-ninja/bin/*.map

  build-x64:
    if: ${{ inputs.arch == 'all' || inputs.arch == 'x64' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [cryptodll, parseflashfile, securityalgo, seednkey_sls]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Crypto++ x64 lib
        shell: pwsh
        run: |
          if (Test-Path "ExtLib/cryptlib64.lib") {
            "CRYPTLIB_PRESENT=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            "CRYPTLIB_PRESENT=false" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "ExtLib/cryptlib64.lib missing, skip x64 build."
          }

      - name: Setup MSVC (x64)
        if: env.CRYPTLIB_PRESENT == 'true' && (inputs.target == 'all' || inputs.target == matrix.target)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (x64)
        if: env.CRYPTLIB_PRESENT == 'true' && (inputs.target == 'all' || inputs.target == matrix.target)
        run: cmake --preset x64-ninja

      - name: Build (x64)
        if: env.CRYPTLIB_PRESENT == 'true' && (inputs.target == 'all' || inputs.target == matrix.target)
        run: cmake --build --preset x64-ninja-release --target ${{ matrix.target }}

      - name: Upload artifacts (x64)
        if: env.CRYPTLIB_PRESENT == 'true' && (inputs.target == 'all' || inputs.target == matrix.target)
        uses: actions/upload-artifact@v6
        with:
          name: x64-${{ matrix.target }}
          path: |
            build/x64-ninja/bin/*.dll
            build/x64-ninja/bin/*.map
